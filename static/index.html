<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓库管理 · ThingsManager</title>
  <link rel="stylesheet" href="app.css?v=0.10.15" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" id="brand-logo">仓</div>
        <div class="brand-text">
          <b id="brand-name">仓库管理</b>
          <span>ThingsManager</span>
        </div>
      </div>
      <div class="srvline" id="srv-wrap" title="服务器连接状态"><span class="srv-dot" id="srv-dot"></span><span id="srv-state">连接中</span></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="nav-btn" data-view="templates"><span class="ico">📄</span><span class="lb">模板设置</span></button>
        <button class="nav-btn" data-view="settings"><span class="ico">⚙️</span><span class="lb">系统设置</span></button>
        <div class="side-credit">
          <span class="side-credit-links">
            <a class="fa-link" href="https://github.com/BH6AOV/ThingsManager" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="GitHub 仓库"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
            <a class="fa-link" href="https://blog.ypa.moe" target="_blank" rel="noopener noreferrer" title="橙子木的自言自语" aria-label="橙子木的自言自语"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
          </span>
          <span class="side-credit-txt">© forever <a href="https://github.com/BH6AOV" target="_blank" rel="noopener noreferrer" title="Github · 橙子木">橙子木</a> · <b class="ver" id="ver-chip" title="点击查看更新日志">V0.10.10</b></span>
        </div>
      </div>
    </aside>
    <div id="side-mask"></div>

    <main class="main">
      <header class="topbar">
        <button class="tbtn" id="nav-toggle" title="打开菜单" type="button" aria-label="打开菜单">☰</button>
        <button class="tbtn" id="side-collapse" title="折叠侧栏" type="button">⏴</button>
        <h1 id="page-title"></h1>
        <div class="topbar-right">
          <div class="gsearch">
            <span class="gs-ico">🔍</span>
            <input id="global-q" type="search" autocomplete="off" placeholder="全局搜索：物资 / SN / 单据 / 器具 / 药品 / 借用 / 互联…" />
            <kbd class="gs-key">Ctrl K</kbd>
          </div>
          <div class="topbar-actions" id="page-actions"></div>
          <button class="tbtn" id="btn-restart" title="重启平台（服务 / 守护会自动拉起，仅短暂中断）" type="button" aria-label="重启平台">⟳</button>
          <button class="tbtn" id="theme-btn" title="切换明 / 暗主题" type="button">🌙</button>
          <!-- 当前登录用户（仅登录后显示）：方块只展示用户名，悬停 / 点击弹出菜单（修改密码 / 退出登录） -->
          <div class="user-chip nav-hidden" id="user-chip" title="当前登录用户">
            <span class="uc-name" id="uc-name"></span><span class="uc-arrow">▾</span>
            <div class="uc-drop">
              <button class="uc-drop-item" id="btn-chpass" type="button"><span class="uc-ico">🔑</span>修改密码</button>
              <div class="uc-sep"></div>
              <button class="uc-drop-item danger" id="btn-logout" type="button"><span class="uc-ico">🚪</span>退出登录</button>
            </div>
          </div>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <input type="file" id="file-picker" hidden />
<script src="vendor/jsQR.js?v=0.10.15"></script>
    <script src="app.js?v=0.10.15"></script>
</body>
</html>
